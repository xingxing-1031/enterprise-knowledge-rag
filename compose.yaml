x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql://rag_user:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/enterprise_rag
  DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
  DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
  MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
  MODEL_NAME: ${MODEL_NAME:-qwen3:4b}
  MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANKER_MIN_SCORE: ${RERANKER_MIN_SCORE:-0.0}
  KNOWLEDGE_DIR: /app/knowledge
  MIGRATIONS_DIR: /app/db/migrations
  FRONTEND_DIST_DIR: /app/frontend/dist
  LATEST_EVALUATION_PATH: /app/evaluation/reports/latest-development.json
  PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-true}
  DEMO_USER_ID: ${DEMO_USER_ID:-demo-employee}
  DEMO_ROLE: ${DEMO_ROLE:-employee}
  DEMO_DEPARTMENTS: ${DEMO_DEPARTMENTS:-hr,finance,admin}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8010,http://localhost:8010}
  DETERMINISTIC_TEST_EMBEDDINGS: ${DETERMINISTIC_TEST_EMBEDDINGS:-false}

x-app-image: &app-image
  image: enterprise-knowledge-rag:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - enterprise_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d enterprise_rag"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    <<: *app-image
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/migrate.py"]
    restart: "no"

  index:
    <<: *app-image
    environment: *app-environment
    volumes:
      - model_cache:/home/appuser/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "scripts/index_knowledge.py"]
    restart: "no"

  api:
    <<: *app-image
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "${APP_PORT:-8010}:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model_cache:/home/appuser/.cache/huggingface
    depends_on:
      index:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  enterprise_rag_pgdata:
  model_cache:
