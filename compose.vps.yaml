x-app-environment: &app-environment
  APP_ENV: production
  DATABASE_URL: postgresql://rag_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/enterprise_rag
  DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
  DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
  MODEL_PROVIDER: openai_compatible
  MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL}
  MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME}
  MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
  EMBEDDING_PROVIDER: openai_compatible
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${MODEL_BASE_URL}}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${MODEL_API_KEY}}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-openai_compatible}
  RERANKER_BASE_URL: ${RERANKER_BASE_URL:-${MODEL_BASE_URL}}
  RERANKER_API_KEY: ${RERANKER_API_KEY:-${MODEL_API_KEY}}
  RERANKER_MODEL: ${RERANKER_MODEL:-qwen3-rerank}
  RERANKER_MIN_SCORE: ${RERANKER_MIN_SCORE:-0.0}
  RETRIEVAL_STRATEGY: ${RETRIEVAL_STRATEGY:-hybrid_rrf_reranker}
  KNOWLEDGE_DIR: /app/knowledge
  MIGRATIONS_DIR: /app/db/migrations
  FRONTEND_DIST_DIR: /app/frontend/dist
  LATEST_EVALUATION_PATH: /app/evaluation/reports/latest-development.json
  PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-true}
  PUBLIC_DEMO_MAX_ROWS: ${PUBLIC_DEMO_MAX_ROWS:-20}
  DEMO_USER_ID: ${DEMO_USER_ID:-demo-employee}
  DEMO_ROLE: ${DEMO_ROLE:-employee}
  DEMO_DEPARTMENTS: ${DEMO_DEPARTMENTS:-hr,finance,admin}
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
  AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_EMPLOYEE_USERNAME: ${AUTH_EMPLOYEE_USERNAME:-employee-demo}
  AUTH_EMPLOYEE_USER_ID: ${AUTH_EMPLOYEE_USER_ID:-demo-employee}
  AUTH_EMPLOYEE_DEPARTMENTS: ${AUTH_EMPLOYEE_DEPARTMENTS:-hr,finance,admin}
  AUTH_DEPARTMENT_ADMIN_USERNAME: ${AUTH_DEPARTMENT_ADMIN_USERNAME:-department-admin-demo}
  AUTH_DEPARTMENT_ADMIN_USER_ID: ${AUTH_DEPARTMENT_ADMIN_USER_ID:-demo-department-admin}
  AUTH_DEPARTMENT_ADMIN_DEPARTMENTS: ${AUTH_DEPARTMENT_ADMIN_DEPARTMENTS:-hr,finance,admin}
  AUTH_KNOWLEDGE_ADMIN_USERNAME: ${AUTH_KNOWLEDGE_ADMIN_USERNAME:-knowledge-admin-demo}
  AUTH_KNOWLEDGE_ADMIN_USER_ID: ${AUTH_KNOWLEDGE_ADMIN_USER_ID:-demo-knowledge-admin}
  AUTH_KNOWLEDGE_ADMIN_DEPARTMENTS: ${AUTH_KNOWLEDGE_ADMIN_DEPARTMENTS:-hr,finance,admin,procurement,security}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8010,http://localhost:8010}
  REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-16384}
  UPLOAD_STORAGE_DIR: /app/data/uploads
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-15728640}
  PDF_MAX_PAGES: ${PDF_MAX_PAGES:-200}
  DOCUMENT_ROUTE_LIMIT: ${DOCUMENT_ROUTE_LIMIT:-4}
  EVIDENCE_MAX_ITEMS: ${EVIDENCE_MAX_ITEMS:-6}
  EVIDENCE_MAX_TOKENS: ${EVIDENCE_MAX_TOKENS:-1200}

x-app-image: &app-image
  image: enterprise-knowledge-rag:${IMAGE_TAG:-vps}
  build:
    context: .
    dockerfile: Dockerfile.vps

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - enterprise_rag_vps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d enterprise_rag"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *app-image
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/migrate.py"]

  index:
    <<: *app-image
    environment: *app-environment
    volumes:
      - enterprise_rag_vps_uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "scripts/index_knowledge.py"]
    restart: "no"

  api:
    <<: *app-image
    restart: unless-stopped
    environment: *app-environment
    expose:
      - "8010"
    volumes:
      - enterprise_rag_vps_uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      index:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8010}:80"
    volumes:
      - ./Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - enterprise_rag_vps_caddy_data:/data
      - enterprise_rag_vps_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  enterprise_rag_vps_pgdata:
  enterprise_rag_vps_uploads:
  enterprise_rag_vps_caddy_data:
  enterprise_rag_vps_caddy_config:
