[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-rag"
version = "0.1.0"
description = "Synthetic enterprise policy and process RAG assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
  "charset-normalizer>=3,<4",
  "fastapi>=0.115,<1",
  "langgraph>=0.6,<2",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
retrieval = [
  "jieba>=0.42,<1",
  "rank-bm25>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]
models = [
  "sentence-transformers>=3,<6",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "reportlab>=4,<5",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
