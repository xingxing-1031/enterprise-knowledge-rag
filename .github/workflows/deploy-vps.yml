name: Deploy VPS release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git commit, tag, or branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: enterprise-rag-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Create release bundle
        shell: bash
        run: |
          set -euo pipefail
          git bundle create release.bundle HEAD
          git rev-parse HEAD > release.sha

      - name: Prepare SSH credentials
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy selected release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$INTERNAL_SERVICE_TOKEN" \
            | sed '1s/^\xEF\xBB\xBF//' \
            | tr -d '\r\n' > "$token_file"
          grep -Eq '^[0-9a-fA-F]{64}$' "$token_file"
          chmod 600 "$token_file"
          release_sha="$(tr -d '\r\n' < release.sha)"
          scp -i ~/.ssh/vps_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 ops/vps_release.sh \
            "$VPS_USER@$VPS_HOST:/tmp/enterprise-rag-vps-release.sh"
          scp -i ~/.ssh/vps_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 release.bundle \
            "$VPS_USER@$VPS_HOST:/tmp/enterprise-rag-release.bundle"
          scp -i ~/.ssh/vps_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$token_file" \
            "$VPS_USER@$VPS_HOST:/tmp/enterprise-rag-internal-service-token"
          ssh -i ~/.ssh/vps_key -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR=/home/ubuntu/enterprise-knowledge-rag SERVICE_TOKEN_FILE=/tmp/enterprise-rag-internal-service-token RELEASE_BUNDLE=/tmp/enterprise-rag-release.bundle bash /tmp/enterprise-rag-vps-release.sh '$release_sha'"
