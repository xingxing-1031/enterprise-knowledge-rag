name: Deploy VPS release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git commit, tag, or branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: enterprise-rag-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4

      - name: Prepare SSH credentials
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy selected release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key ops/vps_release.sh \
            "$VPS_USER@$VPS_HOST:/tmp/enterprise-rag-vps-release.sh"
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR=/home/ubuntu/enterprise-knowledge-rag bash /tmp/enterprise-rag-vps-release.sh '$RELEASE_REF'"
